name: Deploy PVGIS gateway

on:
  push:
    branches: [main]
    paths:
      - 'infra/pvgis-apim/**'
      - '.github/workflows/deploy-pvgis-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pvgis-gateway-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      APIM_PUBLISHER_EMAIL: ${{ vars.APIM_PUBLISHER_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login via OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          test -n "$APIM_PUBLISHER_EMAIL" || { echo 'APIM_PUBLISHER_EMAIL is required'; exit 1; }
          az bicep build --file infra/pvgis-apim/main.bicep

      - name: What-if
        run: >-
          az deployment group what-if
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --template-file infra/pvgis-apim/main.bicep
          --parameters infra/pvgis-apim/main.bicepparam
          publisherEmail="$APIM_PUBLISHER_EMAIL"

      - name: Deploy
        run: >-
          az deployment group create
          --name "pvgis-gateway-${{ github.sha }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --template-file infra/pvgis-apim/main.bicep
          --parameters infra/pvgis-apim/main.bicepparam
          publisherEmail="$APIM_PUBLISHER_EMAIL"
